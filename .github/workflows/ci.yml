name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only stale PR runs are cancelled; every commit on main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Update together with the Rust and Python regression baselines.
  ORCA_COMMIT: 953509c23f8b13deae53abbb2b314f26f7eda606
  ORCA_PROFILES_DIR: ${{ github.workspace }}/.ci-data/OrcaSlicer/resources/profiles

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux core and CLI
            os: ubuntu-24.04
            packages: -p profile-core -p profile-tool
            python: python3
          - name: macOS workspace and UI
            os: macos-15
            packages: --workspace
            python: python3
          # Git's default core.autocrlf=true on Windows runners is kept on purpose: profiles then
          # check out with CRLF, as on a typical Windows machine.
          - name: Windows workspace and UI
            os: windows-2025
            packages: --workspace
            python: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The data is fixed by ORCA_COMMIT, so a cache hit skips the download entirely.
      - name: Restore pinned OrcaSlicer data
        id: orca-data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-data/OrcaSlicer
          key: orca-data-${{ runner.os }}-${{ env.ORCA_COMMIT }}
      # Plain git instead of actions/checkout: the OrcaSlicer tree has a gitlink (src/tiff) without a
      # .gitmodules entry, which makes checkout's post-step `git submodule foreach` fail.
      - name: Fetch pinned OrcaSlicer data
        if: steps.orca-data.outputs.cache-hit != 'true'
        run: |
          rm -rf .ci-data/OrcaSlicer
          git init -q .ci-data/OrcaSlicer
          cd .ci-data/OrcaSlicer
          git remote add origin https://github.com/shixiaozhong/OrcaSlicer.git
          # No leading slash: Git Bash on Windows rewrites arguments that start with `/`. A pattern with
          # an inner slash is anchored to the repository root anyway.
          git sparse-checkout set --no-cone resources/profiles/
          git fetch -q --depth 1 --filter=blob:none origin "$ORCA_COMMIT"
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
      - name: Require regression data
        run: |
          test "$(git -C .ci-data/OrcaSlicer rev-parse HEAD)" = "$ORCA_COMMIT"
          test -f "$ORCA_PROFILES_DIR/OrcaFilamentLibrary.json"
          test -f "$ORCA_PROFILES_DIR/Snapmaker.json"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: stable-${{ matrix.os }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets -- -D warnings
      - name: Tests including real profiles
        run: cargo test --locked --no-fail-fast ${{ matrix.packages }}
      - name: Independent Python regression counts
        run: |
          ${{ matrix.python }} -I docs/reference/profile_format_stats.py "$ORCA_PROFILES_DIR" --check
      # Builds the portable zip (not uploaded) and checks the embedded version resource.
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1

  msrv:
    name: MSRV / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            packages: -p profile-core -p profile-tool
          - os: macos-15
            packages: --workspace
          - os: windows-2025
            packages: --workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}-${{ matrix.os }}
      - name: Check all targets on minimum supported Rust
        run: cargo check --locked ${{ matrix.packages }} --all-targets
