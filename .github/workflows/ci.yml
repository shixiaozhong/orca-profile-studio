name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only stale PR runs are cancelled; every commit on main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Update together with the Rust and Python regression baselines and bundled schema.
  ORCA_COMMIT: 953509c23f8b13deae53abbb2b314f26f7eda606
  ORCA_PROFILES_DIR: ${{ github.workspace }}/.ci-data/OrcaSlicer/resources/profiles

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux core and CLI
            os: ubuntu-24.04
            packages: -p profile-core -p profile-tool
          - name: macOS workspace and UI
            os: macos-15
            packages: --workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The data is fixed by ORCA_COMMIT, so a cache hit skips the download entirely.
      - name: Restore pinned OrcaSlicer data
        id: orca-data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-data/OrcaSlicer
          key: orca-data-${{ runner.os }}-${{ env.ORCA_COMMIT }}
      - name: Check out pinned OrcaSlicer data
        if: steps.orca-data.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shixiaozhong/OrcaSlicer
          ref: ${{ env.ORCA_COMMIT }}
          path: .ci-data/OrcaSlicer
          persist-credentials: false
          # Sparse checkout automatically uses a blob:none partial clone.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /resources/profiles/
            /localization/i18n/zh_CN/
      - name: Require regression data
        run: |
          test "$(git -C .ci-data/OrcaSlicer rev-parse HEAD)" = "$ORCA_COMMIT"
          test -f "$ORCA_PROFILES_DIR/OrcaFilamentLibrary.json"
          test -f "$ORCA_PROFILES_DIR/Snapmaker.json"
          compgen -G '.ci-data/OrcaSlicer/localization/i18n/zh_CN/*_zh_CN.po'
          python3 - <<'PY'
          import json, os
          with open('crates/profile-core/schema/schema.json') as file:
              commit = json.load(file)['source_commit']
          assert commit and os.environ['ORCA_COMMIT'].startswith(commit), commit
          PY
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: stable-${{ matrix.os }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets -- -D warnings
      - name: Tests including real profiles
        run: cargo test --locked ${{ matrix.packages }}
      - name: Independent Python regression counts
        run: |
          python3 -I docs/reference/profile_format_stats.py "$ORCA_PROFILES_DIR" --check
          python3 -I docs/reference/profile_format_stats.py "$ORCA_PROFILES_DIR" crates/profile-core/schema/schema.json --check

  msrv:
    name: MSRV / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            packages: -p profile-core -p profile-tool
          - os: macos-15
            packages: --workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        id: msrv
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}-${{ matrix.os }}
      - name: Check all targets on minimum supported Rust
        run: cargo check --locked ${{ matrix.packages }} --all-targets
