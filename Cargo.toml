[workspace]
resolver = "3"
members = ["crates/profile-core", "crates/profile-tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
profile-core = { path = "crates/profile-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
