[workspace]
resolver = "3"
members = ["crates/profile-core", "crates/profile-tool", "crates/profile-studio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
profile-core = { path = "crates/profile-core" }
anyhow = "1"
gpui-kit = "=0.8.0"
dunce = "1"
clap = { version = "4", features = ["derive", "env"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
